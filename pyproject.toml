requires-python = ">=3.11,<3.14"
dependencies = [
  "dump-things-pyclient",
  "dump-things-service @ git+https://hub.psychoinformatics.de/orinoco/dump-things-service.git@9f101d97c7f15d491f602db5a9c33ad9a19ad8bf",
  "jinja2==3.1.6",
  "pyyaml==6.0.2",
  "query-things @ git+https://hub.psychoinformatics.de/orinoco/query-things.git@ef1141430a471455d4a5f4e07d7989ec717f56f4",
]

[tool.uv]
package = false
required-version = "==0.7.19"
override-dependencies = [
  "dump-things-pyclient @ git+https://hub.psychoinformatics.de/orinoco/dump-things-pyclient.git@1e79391195ad4412286344189dc5f81a06accb90",
]
