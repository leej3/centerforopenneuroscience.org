{{ $includeItems := .Params.items | default "generated" }}
<div class="metadata-list-layout metadata-list-layout-no-filters">
  <div class="metadata-results-panel">
    {{ range .Pages.ByTitle }}
      {{ if or (ne $includeItems "generated") .Params.title }}
        {{ partial "taxonomy-list-vertical-item.html" (dict "page" . "parent" $) }}
      {{ end }}
    {{ end }}
  </div>
</div>
