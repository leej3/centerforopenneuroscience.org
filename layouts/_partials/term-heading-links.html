{{ if or .term.Params.source_code_url .term.Params.documentation_url }}
  <span class="metadata-heading-links">
    {{ with .term.Params.source_code_url }}<a href="{{ . }}" target="_blank" rel="external noopener">Source</a>{{ end }}
    {{ with .term.Params.documentation_url }}<a href="{{ . }}" target="_blank" rel="external noopener">Docs</a>{{ end }}
  </span>
{{ end }}
