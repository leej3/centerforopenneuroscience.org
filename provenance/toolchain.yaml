reproducibility_note: >-
  pixi.lock resolves the complete Linux and macOS build environments, including
  immutable Orinoco VCS commits. package-lock.json pins the graph bundle. The
  Congo gitlink, schema checksum, annex key, and every workflow action are also
  immutable inputs.
