version: 2

environment:
  manager: pixi
  manager_version: 0.73.0
  manifest: pixi.toml
  lockfile: pixi.lock
  platforms: [linux-64, osx-arm64]
  policy: >-
    Pixi is the sole build and test environment. The repository does not use a
    parallel uv environment or download Hugo with a shell installer.
  packages:
    python: 3.12.9
    hugo:
      version: 0.154.5
      edition: extended
    nodejs:
      manifest_constraint: ">=22,<23"
      locked_version: 22.23.1
    git_annex:
      version: 10.20260601
      platform: linux-64
      note: >-
        Used by Linux CI to hydrate the required legacy asset. Conda-forge has
        no osx-arm64 package in this lock; asset hydration is outside the Hugo
        build after the content is present.

orinoco:
  dump_things_service:
    repository: https://hub.psychoinformatics.de/orinoco/dump-things-service.git
    commit: 9f101d97c7f15d491f602db5a9c33ad9a19ad8bf
    resolved_version: 6.3.6
  query_things:
    repository: https://hub.psychoinformatics.de/orinoco/query-things.git
    commit: ef1141430a471455d4a5f4e07d7989ec717f56f4
    resolved_version: 0.1.dev40+gef1141430
  dump_things_pyclient:
    repository: https://hub.psychoinformatics.de/orinoco/dump-things-pyclient.git
    commit: 1e79391195ad4412286344189dc5f81a06accb90
    resolved_version: 0.3.0
  linkml: 1.11.1
  linkml_runtime: 1.11.1
  validation_path: >-
    Each exact repository YAML record is serialized to transient JSONL and
    posted with dtc post-records to an ephemeral Dump Things collection. There
    is no separate downstream record validator in the publication gate.
  projection_path:
    - dtc get-records
    - qri cache
    - qri list
    - scripts/project_records.py
    - qri cache
    - qri inline-records
    - qri render-record

