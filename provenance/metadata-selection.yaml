compatibility_note: >-
  Relationship substitutions above are typed AttributeSpecification objects
  whose targets are strings, not native Thing graph edges. Standard qri link
  traversal cannot discover them. The fixed milestone projection interprets
  only these reviewed predicates and PIDs. See schema-compatibility.yaml.

