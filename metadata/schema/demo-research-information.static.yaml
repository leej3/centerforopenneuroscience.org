name: demo-research-information-schema
description: "This schema is using the FLAT approach (Flexbile Low-complexity\nAnnotation\
  \ Technique) and is geared toward metadata entry and\nsubmission for pooling information\
  \ across consortium sites and\npartners.\n\nIt is to be taken as a demonstrator\
  \ rather than a schema\nbuilding block.\n\nKey features of this schema:\n\n- adds\
  \ a PROV interface to a select set of concepts where provenance\n  information shall\
  \ be recorded. Not all classes receive a PROV interface,\n  because some are just\
  \ used as classifiers or tags. This limits the\n  expressiveness of the schema,\
  \ but also its complexity. For example,\n  it is an active decision to *not* be\
  \ interested in the provenance\n  of a `Convention` or a `Rule`, but to only represent\
  \ them as facts\n  about the world.\n\nMore information may be available on the\
  \ schema's [about page](about).\n\nThe schema definition is available as\n\n- [JSON-LD\
  \ context](../unreleased.context.jsonld)\n- [LinkML YAML](../unreleased.yaml)\n\
  - [LinkML YAML (static/resolved)](../unreleased.static.yaml)\n- [OWL TTL](../unreleased.owl.ttl)\n\
  - [SHACL TTL](../unreleased.shacl.ttl)\n"
title: Data model for capturing information on research (progress)
comments:
- ALL CONTENT HERE IS UNRELEASED AND MAY CHANGE ANY TIME
status: eunal:concept-status/DRAFT
