    broad_mappings:
    - sio:SIO_000426
    domain: Distribution
    slot_uri: https://concepts.datalad.org/s/things-distributions/v1/distribution_of
    inverse: distributions
    range: Thing
  byte_size:
    name: byte_size
    description: The size of the subject in bytes.
    from_schema: https://concepts.datalad.org/s/things-files/v1
    exact_mappings:
    - dcat:byteSize
    slot_uri: https://concepts.datalad.org/s/things-files/v1/byte_size
    range: NonNegativeInteger
  checksums:
    name: checksums
    description: The checksum property provides a mechanism that can be used to verify
      that the contents of a file or package have not changed.
    from_schema: https://concepts.datalad.org/s/things-files/v1
    exact_mappings:
