    is_a: name
    slot_uri: https://concepts.datalad.org/s/things-social/v1/formatted_name
    range: string
  honorific_name_prefix:
    name: honorific_name_prefix
    description: The honorific prefix(es) of the subject's name. For example, (academic/formal)
      titles like "Mrs", or "Dr", "Dame".
    title: Title or prefix
    from_schema: https://concepts.datalad.org/s/things-social/v1
    exact_mappings:
    - vcard:honorific-prefix
    is_a: name
    slot_uri: https://concepts.datalad.org/s/things-social/v1/honorific_name_prefix
    range: string
  honorific_name_suffix:
    name: honorific_name_suffix
    description: The honorific suffix(es) of the subject's name. For example, generation
      labels ("III"), or indicators of an academic degree, a profession, or a position
      ("MD", "BA").
    title: Suffix
    from_schema: https://concepts.datalad.org/s/things-social/v1
    exact_mappings:
    - vcard:honorific-suffix
    is_a: name
    slot_uri: https://concepts.datalad.org/s/things-social/v1/honorific_name_suffix
    range: string
  given_name:
    name: given_name
    description: The given (non-inherited) name of the subject.
    title: Given name
    from_schema: https://concepts.datalad.org/s/things-social/v1
    exact_mappings:
    - foaf:givenName
    - vcard:given-name
    is_a: name
    slot_uri: https://concepts.datalad.org/s/things-social/v1/given_name
    range: string
  nickname:
    name: nickname
    description: A short informal, invented given name for a person or thing used
      instead of the actual name of the person or thing.
    title: Nickname
    from_schema: https://concepts.datalad.org/s/things-social/v1
    exact_mappings:
    - vcard:nickname
    is_a: name
    slot_uri: https://concepts.datalad.org/s/things-social/v1/nickname
    range: string
  additional_names:
    name: additional_names
    description: Additional name(s) associated with the subject, such as one or more
      middle names.
    title: Additional names
    from_schema: https://concepts.datalad.org/s/things-social/v1
    exact_mappings:
    - vcard:additional_name
    is_a: name
    slot_uri: https://concepts.datalad.org/s/things-social/v1/additional_names
    range: string
    multivalued: true
  dimensions:
    name: dimensions
    description: Associated outcome variables.
    title: Outcomes variables
    from_schema: https://concepts.datalad.org/s/things-study/v1
    slot_uri: https://concepts.datalad.org/s/things-study/v1/dimensions
    range: Thing
    multivalued: true
  factors:
    name: factors
    description: Factors that influence the subject matter.
    title: Influencing factors
    from_schema: https://concepts.datalad.org/s/things-study/v1
    slot_uri: https://concepts.datalad.org/s/things-study/v1/factors
    range: Thing
    multivalued: true
  study:
    name: study
    description: The study in which, for example, a subject was investigated.
    title: Study context
    from_schema: https://concepts.datalad.org/s/things-study/v1
    slot_uri: https://concepts.datalad.org/s/things-study/v1/study
    range: Study
  about:
    name: about
    description: A relation of an information artifact to the subject, such as a URL
      identifying the topic of a document.
    title: About
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - schema:about
    - obo:IAO_0000136
    slot_uri: dcterms:subject
    range: Thing
  annotations:
    name: annotations
    description: A record of properties of the metadata record on a subject, a collection
      of tag/text tuples with the semantics of OWL Annotation.
    title: Annotations
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - obo:NCIT_C44272
    slot_uri: dlthings:annotations
    range: Annotation
    multivalued: true
    inlined: true
  annotation_tag:
    name: annotation_tag
    description: A tag identifying an annotation.
    title: Tag
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: dlthings:annotation_tag
    range: Thing
  annotation_value:
    name: annotation_value
    description: The actual annotation.
    title: Value
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: dlthings:annotation_value
    range: string
  attributes:
    name: attributes
    description: Declares a relation that associates a `Thing` (or another attribute)
      with an attribute, where an attribute is an intrinsic characteristic, such as
      a quality, capability, disposition, function, or is an externally derived attribute
      determined from some descriptor (e.g. a quantity, position, label/identifier).
      Technically, this declaration is done via an `AttributeSpecification` that combines
      a `predicate` with a value declaration and the attribute-related slots of a
      `Thing`. Importantly, such attributes are declared inline, because they do not
      have a unique identifier. If an identifier is available, a `Thing` declaration
      (see `relation`), and a qualification of that relationship via a `Statement`
      (see `characterized_by`) should be preferred.
    title: Attributes
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - sio:SIO_000008
    slot_uri: dlthings:attributes
    range: AttributeSpecification
    multivalued: true
    inlined: true
    inlined_as_list: true
  broad_mappings:
    name: broad_mappings
    description: A list of terms from different schemas or terminology systems that
      have broader meaning.
    title: Broad mappings
    from_schema: https://concepts.datalad.org/s/things/v2
    is_a: mappings
    slot_uri: skos:broadMatch
    range: uriorcurie
    multivalued: true
  characterized_by:
    name: characterized_by
    description: Qualifies relationships between a subject `Thing` and an object `Thing`
      with a `Statement` declaring a `predicate` on the nature of the relationship.
    title: Characterized by
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - obo:RO_0000053
    slot_uri: dlthings:characterized_by
    range: Statement
    multivalued: true
    inlined: true
    inlined_as_list: true
  close_mappings:
    name: close_mappings
    description: A list of terms from different schemas or terminology systems that
      have close meaning.
    title: Close mappings
    from_schema: https://concepts.datalad.org/s/things/v2
    is_a: mappings
    slot_uri: skos:closeMatch
    range: uriorcurie
    multivalued: true
  creator:
    name: creator
    description: An agent responsible for making an entity.
    title: Creator
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: dcterms:creator
    range: Thing
  defined_by:
    name: defined_by
    description: Indicate a resource defining the subject. This may be a vocabulary
      that describes the subject.
    title: Defined by
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: rdfs:isDefinedBy
    range: uriorcurie
  description:
    name: description
    annotations:
      dash:singleLine:
        tag: dash:singleLine
        value: false
    description: A free-text account of the subject.
    title: Description
    from_schema: https://concepts.datalad.org/s/things/v2
    close_mappings:
    - rdfs:comment
    broad_mappings:
    - obo:IAO_0000300
    slot_uri: dcterms:description
    range: string
  display_label:
    name: display_label
    description: Label that can be shown when the metadata record is displayed as
      an item.
    title: Record display label
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: skos:prefLabel
    range: string
  display_note:
    name: display_note
    annotations:
      dash:singleLine:
        tag: dash:singleLine
        value: false
    description: Note that can be shown when the record is displayed as an item. This
      is typically longer than a label.
    title: Record display note
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: skos:note
    range: string
  editorial_notes:
    name: editorial_notes
    annotations:
      dash:singleLine:
        tag: dash:singleLine
        value: false
    description: A comment about a metadata record either providing additional information
      for a record curation, or leaving a comment after curation occurred. This can
      be used to include information that is deemed relevant, but could not be expressed
      in the provided fields.
    title: Editorial note
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: skos:editorialNote
    range: string
    multivalued: true
  exact_mappings:
    name: exact_mappings
    description: A list of terms from different schemas or terminology systems that
      have identical meaning.
    title: Exact mappings
    from_schema: https://concepts.datalad.org/s/things/v2
    is_a: mappings
    slot_uri: skos:exactMatch
    range: uriorcurie
    multivalued: true
  identifiers:
    name: identifiers
    description: An unambiguous reference to the subject within a given context.
    title: Identifiers
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - schema:identifier
    slot_uri: dcterms:identifier
    range: Identifier
    multivalued: true
    inlined: true
    inlined_as_list: true
  kind:
    name: kind
    description: The nature of the subject.
    title: Kind
    comments:
    - This is conceptually the same as an instance-level `broad_mappings`. It can
      make sense to use this slot (in addition) in order to enable straightforward
      type declarations for instances from a controlled, application specific vocabulary,
      while also keeping the ability to use `broad_mappings` for alignment with external
      vocabularies and applications.
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - dcterms:type
    slot_uri: dcterms:type
    range: Thing
  mappings:
    name: mappings
    description: A list of terms from different schemas or terminology systems that
      have comparable meaning. These may include terms that are precisely equivalent,
      broader or narrower in meaning, or otherwise semantically related but not equivalent
      from a strict ontological perspective.
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: skos:mappingRelation
    range: uriorcurie
    multivalued: true
  narrow_mappings:
    name: narrow_mappings
    description: A list of terms from different schemas or terminology systems that
      have narrower meaning.
    title: Narrow mappings
    from_schema: https://concepts.datalad.org/s/things/v2
    is_a: mappings
    slot_uri: skos:narrowMatch
    range: uriorcurie
    multivalued: true
  notation:
    name: notation
    description: String of characters such as "T58:5" or "30:4833" used to uniquely
      identify a concept within the scope of a given concept scheme.
    title: Notation
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: skos:notation
    range: string
  object:
    name: object
    description: Reference to a `Thing` within a `Statement`.
    title: Object
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - rdf:object
    slot_uri: rdf:object
    relational_role: OBJECT
    range: Thing
  pid:
    name: pid
    description: Persistent and globally unique identifier of a `Thing`.
    title: Persistent identifier
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - dcterms:identifier
    - schema:identifier
    slot_uri: dlthings:pid
    identifier: true
    range: uriorcurie
  predicate:
    name: predicate
    description: Reference to a `Property` within a `Statement`.
    title: Predicate
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - rdf:predicate
    slot_uri: rdf:predicate
    relational_role: PREDICATE
    range: Thing
    multivalued: false
  range:
    name: range
    description: Declares that the value of a `Thing` or `AttributeSpecification`
      are instances of a particular class.
    title: Value type (range)
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: rdfs:range
    range: uriorcurie
  related_mappings:
    name: related_mappings
    description: A list of terms from different schemas or terminology systems that
      have related meaning.
    title: Related mappings
    from_schema: https://concepts.datalad.org/s/things/v2
    is_a: mappings
    slot_uri: skos:relatedMatch
    range: uriorcurie
    multivalued: true
  relations:
    name: relations
    description: Declares an unqualified relation of the subject `Thing` to another
      `Thing`. This schema slot is used to define related things inline. If such a
      definition is not needed. A qualified relationship can be declared directly
      using the `characterized_by` slot.
    title: Relations
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - dcat:relation
    - dcterms:relation
    slot_uri: dlthings:relation
    symmetric: true
    relational_role: OBJECT
    range: Thing
    multivalued: true
  schema_type:
    name: schema_type
    description: State that the subject is an instance of a particular schema class.
      Typically, no explicit value needs to be assigned to this slot, because it matches
      the class type of a particular record. However, this slots can be used as a
      type designator of a schema element for validation and schema structure handling
      purposes. This is used to indicate specialized schema classes for properties
      that accept a hierarchy of classes as their range.
    title: Schema type
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - dcterms:type
    slot_uri: rdf:type
    designates_type: true
    range: NodeUriOrCurie
  unit:
    name: unit
    description: A unit of measurement is a standardized quantity of a physical quality.
    title: Unit
    from_schema: https://concepts.datalad.org/s/things/v2
    slot_uri: obo:UO_0000000
    range: uriorcurie
  value:
    name: value
    description: Value that is a direct representation of a thing.
    title: Value
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - rdf:value
    slot_uri: rdf:value
    relational_role: OBJECT
    range: string
  rules:
    name: rules
    description: Permissions, prohibitions, obligations or other rights/policies associated
      with the resource. This could refer to a standard license, a custom usage agreement,
      or a codified policy.
    title: Rules
    from_schema: https://concepts.datalad.org/s/things-rules/v1
    narrow_mappings:
    - ODRL:hasPolicy
    - dcterms:rights
    - dcterms:license
    slot_uri: https://concepts.datalad.org/s/things-rules/v1/rules
    range: Rule
    multivalued: true
classes:
  XYZAccolade:
    name: XYZAccolade
    description: An award, prize, or other honor received in recognition of an achievement.
    title: Accolade
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    mixins:
    - EntityMixin
    slots:
    - depiction
    - title
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
    class_uri: xyzri:XYZAccolade
  XYZActivity:
    name: XYZActivity
    description: 'An activity is something that occurs over a period of time and acts
      upon or with entities; it may include consuming, processing, transforming, modifying,
      relocating, using, or generating entities.

      The primary purpose of this metadata type is the descriptions of an entity''s
      provenance (e.g., the identification of the (data) generating activity).'
    title: Activity
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    exact_mappings:
    - prov:Activity
    broad_mappings:
    - obo:BFO_0000015
    is_a: Thing
    mixins:
    - ActivityMixin
    slots:
    - name
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: XYZActivity
        multivalued: true
    class_uri: xyzri:XYZActivity
  XYZCompetition:
    name: XYZCompetition
    description: A process where multiple agents compete for a resource, such as funding,
      recognition, or participation.
    title: Competition
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    narrow_mappings:
    - FRAPO:FundingProgramme
    is_a: Thing
    mixins:
    - ActivityMixin
    slots:
    - application_deadline
    - title
    slot_usage:
      kind:
        name: kind
        range: XYZCompetitionType
      about:
        name: about
        description: Topics related to this competition.
        title: Topic(s)
        range: XYZTopic
        recommended: true
        multivalued: true
      associated_with:
        name: associated_with
        multivalued: true
        inlined_as_list: true
      informed_by:
        name: informed_by
        range: XYZCommunication
        multivalued: true
        inlined_as_list: true
      ended:
        name: ended
        description: The conclusion of the competition, typically the point of decision-making,
          or announcement of the winners.
        title: End
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZCompetition
  XYZDataItem:
    name: XYZDataItem
    description: 'An information content entity that is intended to be a truthful
      statement about something (modulo, e.g., measurement precision or other systematic
      errors) and is constructed/acquired by a method which reliably tends to produce
      (approximately) truthful statements.

      This is a conceptual entity. A single data item might be available in more than
      one representation, with differing formats, and serializations.'
    title: Data item
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: DataItem
    mixins:
    - EntityMixin
    slot_usage:
      part_of:
        name: part_of
        range: XYZDataset
        multivalued: true
      kind:
        name: kind
        range: XYZDataType
    class_uri: xyzri:XYZDataItem
  XYZDataset:
    name: XYZDataset
    description: A collection of data, published or curated by a single agent. This
      is a conceptual entity. A single dataset might be available in more than one
      representation, with differing schematic layouts, formats, and serializations.
    title: Dataset
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Dataset
    mixins:
    - EntityMixin
    slots:
    - depiction
    - rules
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
      part_of:
        name: part_of
        range: XYZDataset
        multivalued: true
      attributed_to:
        name: attributed_to
        multivalued: true
        inlined_as_list: true
      generated_by:
        name: generated_by
        multivalued: true
        inlined_as_list: true
      derived_from:
        name: derived_from
        multivalued: true
        inlined_as_list: true
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
      kind:
        name: kind
        range: XYZDataType
    class_uri: xyzri:XYZDataset
  XYZDepiction:
    name: XYZDepiction
    description: 'Reference conveyed through pictures.

      This is a conceptual entity. A single depiction can be available, for example,
      as a digital images in various (file) formats.'
    title: Depiction
    comments:
    - A `Depiction` can be annotated with various common aspects using standard PROV
      properties. For example, `attribution_to` a photographer, depicted subjects
      or content via a link through `derived_from`, etc.
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    mixins:
    - EntityMixin
    slots:
    - conforms_to
    - distributions
    - rules
    - title
    slot_usage:
      kind:
        name: kind
        range: XYZDepictionType
      distributions:
        name: distributions
        range: XYZFile
        multivalued: true
      conforms_to:
        name: conforms_to
        range: Convention
        multivalued: true
    class_uri: xyzri:XYZDepiction
  XYZFile:
    name: XYZFile
    description: A specific representation of a data item, which may come in the form
      of an electronic file, or an archive or (also) a directory comprising many files.
    title: File
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: File
    mixins:
    - EntityMixin
    slots:
    - conforms_to
    - rules
    slot_usage:
      kind:
        name: kind
        range: XYZDataType
      distribution_of:
        name: distribution_of
        multivalued: true
      conforms_to:
        name: conforms_to
        range: Convention
        multivalued: true
      generated_by:
        name: generated_by
        multivalued: true
        inlined_as_list: true
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZFile
  XYZDocument:
    name: XYZDocument
    description: A conceptual entity representing things which a, broadly conceived,
      "documents. This includes non-textual things like images. A conceputal document
      is to be distinguished from its physical, or electronic distributions.
    title: Document
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Document
    mixins:
    - EntityMixin
    slots:
    - rules
    - distributions
    slot_usage:
      kind:
        name: kind
        description: The type of this document, e.g. journal article, book, webpage
        title: Document type
        range: XYZBibliographicType
      part_of:
        name: part_of
        multivalued: true
      attributed_to:
        name: attributed_to
        title: Contributors
        multivalued: true
        inlined_as_list: true
      generated_by:
        name: generated_by
        multivalued: true
        inlined_as_list: true
      derived_from:
        name: derived_from
        multivalued: true
        inlined_as_list: true
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZDocument
  XYZGrant:
    name: XYZGrant
    description: A grant, typically financial or otherwise quantifiable, resources.
    title: Grant
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Grant
    mixins:
    - EntityMixin
    slots:
    - rules
    slot_usage:
      part_of:
        name: part_of
        range: XYZGrant
        multivalued: true
      attributed_to:
        name: attributed_to
        multivalued: true
        inlined_as_list: true
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZGrant
  XYZInstrument:
    name: XYZInstrument
    description: 'A thing that enables an agent to perform an action. This is typically
      a device (e.g., a machine to perform a particular type of measurement), but
      it can also be a questionnaire that is used to perform a particular kind of
      assessment.

      An instrument is typically neither a "reagent", nor an abstract concept. For
      example, in the case of behavioral experiment with a particular stimulus, only
      the concrete implementation of the stimulation would be considered an `Instrument`,
      while the underlying abstract paradigm would be captured as a `Concept`. In
      the case of a personality test, the `Instrument` is a concrete questionnaire
      implementation, whereas an underlying personality model factor is to be considered
      as a `Concept`.

      The primary purpose of this metadata type is the identification of instruments
      used in (data) generating activities.'
    title: Instrument
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Instrument
    mixins:
    - EntityMixin
    slots:
    - depiction
    - part_of
    - rules
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
      kind:
        name: kind
        description: The type of this instrument, e.g. microscope, software, chainsaw
        title: Instrument type
        range: XYZInstrumentType
      part_of:
        name: part_of
        range: XYZInstrument
        multivalued: true
      attributed_to:
        name: attributed_to
        multivalued: true
        inlined_as_list: true
      generated_by:
        name: generated_by
        multivalued: true
        inlined_as_list: true
      alternate_of:
        name: alternate_of
        range: Thing
        multivalued: true
      specialization_of:
        name: specialization_of
        range: Thing
        multivalued: true
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZInstrument
  XYZObjective:
    name: XYZObjective
    description: A proposition that indicates a planned or anticipated outcome.
    title: Objective
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    mixins:
    - EntityMixin
    slots:
    - title
    - part_of
    - depends_on
    - depiction
    slot_usage:
      part_of:
        name: part_of
        range: XYZObjective
        multivalued: true
      depends_on:
        name: depends_on
        range: XYZObjective
        multivalued: true
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
    class_uri: xyzri:XYZObjective
  XYZOrganization:
    name: XYZOrganization
    description: A social or legal institution such as a company, a society, or a
      university.
    title: Organization
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Organization
    mixins:
    - AgentMixin
    slots:
    - depiction
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
      part_of:
        name: part_of
        description: An organization that the subject is part of.
        range: XYZOrganization
        multivalued: true
      delegated_by:
        name: delegated_by
        multivalued: true
        inlined_as_list: true
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZOrganization
  XYZPerson:
    name: XYZPerson
    description: Person agents are people, alive, dead, or fictional.
    title: Person
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Person
    mixins:
    - AgentMixin
    slots:
    - depiction
    - nickname
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
      delegated_by:
        name: delegated_by
        multivalued: true
        inlined_as_list: true
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZPerson
  XYZProject:
    name: XYZProject
    description: A collective endeavour of some kind. Typically it is a planned process
      that is undertaken or attempted to meet some requirement, or to achieve a particular
      goal.
    title: Project
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Project
    mixins:
    - ActivityMixin
    slots:
    - depiction
    - part_of
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
      part_of:
        name: part_of
        range: XYZProject
        multivalued: true
      associated_with:
        name: associated_with
        multivalued: true
        inlined_as_list: true
      used:
        name: used
        multivalued: true
        inlined_as_list: true
      informed_by:
        name: informed_by
        range: XYZCommunication
        multivalued: true
        inlined_as_list: true
      started:
        name: started
        title: Start
      ended:
        name: ended
        title: End
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZProject
  XYZPublication:
    name: XYZPublication
    description: A resource that is the output of a publishing process.
    title: Publication
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Publication
    mixins:
    - EntityMixin
    slots:
    - depiction
    - rules
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
      kind:
        name: kind
        description: The type of this publication, e.g. journal article, book, webpage
        title: Publication type
        range: XYZBibliographicType
      title:
        name: title
        description: The full title of the publication.
        required: false
      description:
        name: description
        title: Abstract
      about:
        name: about
        description: Topics covered by this publication.
        title: Topic(s)
        range: XYZTopic
        recommended: true
        multivalued: true
      attributed_to:
        name: attributed_to
        title: Contributors
        multivalued: true
        inlined_as_list: true
      generated_by:
        name: generated_by
        multivalued: true
        inlined_as_list: true
      influenced_by:
        name: influenced_by
        range: XYZInfluence
        multivalued: true
        inlined_as_list: true
    class_uri: xyzri:XYZPublication
  XYZStudy:
    name: XYZStudy
    description: 'A planned process that consists of parts: planning, study design
      execution, documentation and which produce conclusion(s). An investigational
      endeavour that involves research, enabled by a project. The study relates to
      the scholarly and practical aspects of conducting the research itself, including
      the hypotheses being investigated, the data being gathered and analysed, the
      interpretations being drawn from the data, and the results obtained. In contrast,
      a project that enables it encompasses the administrative aspects of undertaking
      the endeavour, including the funding obtained, the people involved, and the
      management of the project in terms of deadlines and deliverables.'
    title: Study
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Study
    mixins:
    - ActivityMixin
    slots:
    - depiction
    - rules
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
      dimensions:
        name: dimensions
        range: XYZConcept
      factors:
        name: factors
        range: XYZConcept
      kind:
        name: kind
        range: XYZSubjectType
    class_uri: xyzri:XYZStudy
  XYZSubject:
    name: XYZSubject
    description: A subject is an entity being investigated in a study. This is a contextual
      entity. One and the same individual can be different subjects in two different
      studies.
    title: Subject
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Subject
    mixins:
    - EntityMixin
    slots:
    - rules
    slot_usage:
      study:
        name: study
        range: XYZStudy
      kind:
        name: kind
        range: XYZSubjectType
    class_uri: xyzri:XYZSubject
  XYZActivityRole:
    name: XYZActivityRole
    description: A role is the function of an activity with respect to a subject,
      in the context of an influence.
    title: Activity role
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    broad_mappings:
    - prov:Role
    - dcat:Role
    is_a: Thing
