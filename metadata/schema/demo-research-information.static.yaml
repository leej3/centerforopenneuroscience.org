    slot_uri: https://concepts.datalad.org/s/things-properties/v1/title
    range: string
  version_of:
    name: version_of
    description: A related resource of which the described resource is a version,
      edition, or adaptation.
    from_schema: https://concepts.datalad.org/s/things-properties/v1
    exact_mappings:
    - dcterms:isVersionOf
    slot_uri: https://concepts.datalad.org/s/things-properties/v1/version_of
    range: Thing
  distributions:
    name: distributions
    description: Available distributions of an entity.
    title: Distributions
    from_schema: https://concepts.datalad.org/s/things-distributions/v1
    exact_mappings:
    - dcat:distribution
    broad_mappings:
    - sio:SIO_000341
    domain: Thing
    slot_uri: https://concepts.datalad.org/s/things-distributions/v1/distributions
    inverse: distribution_of
    range: Distribution
    multivalued: true
  distribution_of:
