      the context of an influence.
    title: Agent role
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    broad_mappings:
    - prov:Role
    - dcat:Role
    is_a: Thing
    slots:
    - name
    class_uri: xyzri:XYZAgentRole
  XYZBibliographicType:
    name: XYZBibliographicType
    description: Type of a publication or document, e.g., journal article, book, or
      webpage.
    title: Bibliographic type
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    class_uri: xyzri:XYZBibliographicType
  XYZCompetitionType:
    name: XYZCompetitionType
    description: Type of a competitions, e.g., call for proposals, horse race, job
      opening.
    title: Competition type
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    class_uri: xyzri:XYZCompetitionType
  XYZConcept:
    name: XYZConcept
    description: 'An idea or notion; a unit of thought.

      In the context of a study, this can be a tag associated with a categorical,
      independent variable in a study design, an investigative role (e.g., treatments),
      or an organizational nature (e.g., site labels), or a dependent or outcome variable.

      `Concept` is related to `Topic`. However a concept is more focused and more
      clearly delineated in comparison.

      The primary purpose of this metadata type is the identification of influencing
      factors or outcome variable related to (scientific) investigations.'
    title: Concept
    comments:
    - The relationship of a focused concept with the broader concept can be described
      via `broader_mappings`.
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    slots:
    - title
    class_uri: xyzri:XYZConcept
  XYZDataType:
    name: XYZDataType
    description: Type of an data item.
    title: Data type or format
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    narrow_mappings:
    - obo:NCIT_C171252
    - obo:NCIT_C42645
    - obo:NCIT_C172272
    broad_mappings:
    - dcterms:format
    is_a: Thing
    slots:
    - version_of
    slot_usage:
      version_of:
        name: version_of
        title: Variant of
        range: XYZDataType
    class_uri: xyzri:XYZDataType
  XYZDepictionType:
    name: XYZDepictionType
    description: Type of a depiction.
    title: Depiction type
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    class_uri: xyzri:XYZDepictionType
  XYZEntityRole:
    name: XYZEntityRole
    description: A role is the function of an entity with respect to a subject, in
      the context of an influence.
    title: Entity role
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    broad_mappings:
    - prov:Role
    - dcat:Role
    is_a: Thing
    slots:
    - name
    class_uri: xyzri:XYZEntityRole
  XYZInstrumentType:
    name: XYZInstrumentType
    description: Type of an instrument.
    title: Instrument type
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    class_uri: xyzri:XYZInstrumentType
  XYZPublicationVenue:
    name: XYZPublicationVenue
    description: '"Place" of a publication, e.g., a journal, a website, an edited
      collection.'
    title: Publication venue
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    slots:
    - title
    - kind
    slot_usage:
      title:
        name: title
        description: The full title of the publication.
        required: false
      kind:
        name: kind
        description: The type of this publication venue, e.g. journal article, book,
          webpage
        title: Publication venue type
        range: XYZBibliographicType
    class_uri: xyzri:XYZPublicationVenue
  XYZQuality:
    name: XYZQuality
    description: A quality is an attribute that is intrinsically associated with its
      bearer (or its parts), but whose presence/absence and observed/measured value
      may vary.
    title: Quality
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    class_uri: xyzri:XYZQuality
  XYZSubjectType:
    name: XYZSubjectType
    description: Type of a subject (e.g., human study participant, soil sample, cell
      culture).
    title: Subject type
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    class_uri: xyzri:XYZSubjectType
  XYZTopic:
    name: XYZTopic
    description: Topic a subject is about, e.g., a particular research question or
      domain
    title: Topic
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Thing
    slots:
    - depiction
    - part_of
    slot_usage:
      depiction:
        name: depiction
        range: XYZDepiction
        multivalued: true
      part_of:
        name: part_of
        range: XYZTopic
        multivalued: true
    class_uri: xyzri:XYZTopic
  ORCID:
    name: ORCID
    description: Unique persistent identifier for a person, provided by the Open Researcher
      and Contributor ID (ORCID) organisation.
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    exact_mappings:
    - obo:IAO_0000708
    is_a: Identifier
    slot_usage:
      notation:
        name: notation
        description: The identifier notation is specified without a URL-prefix, or
          a `orcid:` prefix.
        pattern: ^\d{4}-\d{4}-\d{4}-\d{3}[0-9X]{1}$
    class_uri: xyzri:ORCID
    unique_keys:
      value:
        unique_key_name: value
        unique_key_slots:
        - notation
        description: The ORCID notation is globally unique within the scope of ORCIDs
  XYZCommunication:
    name: XYZCommunication
    description: The exchange of an entity by two activities, one activity using the
      entity generated by the other. This implies a dependency of the subject activity
      on the associated activity.
    title: Communication
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Communication
    slots:
    - entity
    slot_usage:
      entity:
        name: entity
        description: An entity used by the subject, and produced by the associated
          activity.
    class_uri: xyzri:XYZCommunication
  XYZInfluence:
    name: XYZInfluence
    description: Influence is the capacity of an entity, activity, or agent to have
      an effect on the character, development, or behavior of another by means of
      usage, start, end, generation, invalidation, communication, derivation, attribution,
      association, or delegation.
    from_schema: https://concepts.datalad.org/s/demo-research-information/unreleased
    is_a: Influence
    slots:
    - ended
    - started
    class_uri: xyzri:XYZInfluence
  DataItem:
    name: DataItem
    description: 'An information content entity that is intended to be a truthful
      statement about something (modulo, e.g., measurement precision or other systematic
      errors) and is constructed/acquired by a method which reliably tends to produce
      (approximately) truthful statements.

      This is a conceptual entity. A single data item might be available in more than
      one representation, with differing formats, and serializations.'
    from_schema: https://concepts.datalad.org/s/things-data/v1
    exact_mappings:
    - obo:IAO_0000027
    is_a: Thing
    mixins:
    - ValueSpecificationMixin
    slots:
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: Dataset
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-data/v1/DataItem
  Dataset:
    name: Dataset
    description: A collection of data (data items), published or curated by a single
      agent.  This is a conceptual entity. A single dataset might be available in
      more than one representation, with differing schematic layouts, formats, and
      serializations.
    from_schema: https://concepts.datalad.org/s/things-data/v1
    exact_mappings:
    - dcat:Dataset
    is_a: Thing
    slots:
    - title
    - short_name
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: Dataset
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-data/v1/Dataset
  Distribution:
    name: Distribution
    description: A specific (physical) manifestation conceptual entity.
    from_schema: https://concepts.datalad.org/s/things-distributions/v1
    exact_mappings:
    - dcat:Distribution
    is_a: Thing
    slots:
    - distribution_of
    slot_usage:
      distribution_of:
        name: distribution_of
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-distributions/v1/Distribution
  Checksum:
    name: Checksum
    description: A Checksum is a value that allows to check the integrity of the contents
      of a file. Even small changes to the content of the file will change its checksum.
      This class allows the results of a variety of checksum and cryptographic message
      digest algorithms to be represented.
    from_schema: https://concepts.datalad.org/s/things-files/v1
    exact_mappings:
    - spdx:Checksum
    is_a: Identifier
    slot_usage:
      creator:
        name: creator
        description: Identifies the software agent (algorithm) used to produce the
          subject `Checksum`.
        exact_mappings:
        - spdx:algorithm
        required: true
      notation:
        name: notation
        description: Lower case hexadecimal encoded checksum digest value.
        exact_mappings:
        - spdx:checksumValue
        range: HexBinary
        required: true
    class_uri: https://concepts.datalad.org/s/things-files/v1/Checksum
  File:
    name: File
    description: A specific representation of a data item in the form of an electronic
      file. The concept of a file here is aligned with the broad UNIX philoshopy of
      "everything is a file". An archive, a disk image, a directory are all valid
      instances of a file.
    comments:
    - There is no `name` property or similar, because the focus is on the identity
      of the distribution content, not how it might be named in a particular context.
      For example, an image in JPEG format might be names "20250825_102385.jpg" on
      a camera and "me_at_the_party.jpg" elsewhere, but it would be the exact same
      image. Expressing naming in some context should be done within the scope of
      the containing entity (see `named_parts`).
    from_schema: https://concepts.datalad.org/s/things-files/v1
    broad_mappings:
    - fabio:DigitalManifestation
    is_a: Distribution
    slots:
    - byte_size
    - checksums
    - format
    - media_type
    - parts
    - part_of
    slot_usage:
      distribution_of:
        name: distribution_of
        multivalued: true
      parts:
        name: parts
        range: NamedFilePart
        inlined: true
      part_of:
        name: part_of
        range: File
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-files/v1/File
  NamedFilePart:
    name: NamedFilePart
    description: An association class for attaching a `locator` as additional information
      to a `hasPart` relationship between two files.
    from_schema: https://concepts.datalad.org/s/things-files/v1
    slots:
    - locator
    - roles
    - object
    slot_usage:
      locator:
        name: locator
        description: A relative path in POSIX notation.
        key: true
        pattern: ^[^/]+.*$
      object:
        name: object
        range: File
        required: true
    class_uri: https://concepts.datalad.org/s/things-files/v1/NamedFilePart
  DOI:
    name: DOI
    description: Digital Object Identifier (DOI; ISO 26324), an identifier system
      governed by the DOI Foundation, where individual identifiers are issued by one
      of several registration agencies.
    from_schema: https://concepts.datalad.org/s/things-publications/v1
    is_a: Identifier
    slot_usage:
      notation:
        name: notation
        description: The identifier notation is specified without a URL-prefix, or
          a `doi:` prefix.
        pattern: (?i)^(?!(?:https?://|doi:)).+$
    class_uri: https://concepts.datalad.org/s/things-publications/v1/DOI
    unique_keys:
      value:
        unique_key_name: value
        unique_key_slots:
        - notation
        description: The DOI notation is globally unique within the scope of DOIs
  ISSN:
    name: ISSN
    description: International Standard Serial Number (ISSN).
    comments:
    - The creator is ror:026ytr635
    from_schema: https://concepts.datalad.org/s/things-publications/v1
    related_mappings:
    - schema:issn
    is_a: Identifier
    slot_usage:
      notation:
        name: notation
        description: The identifier notation is specified without any prefix.
        pattern: ^\d{4}-\d{3}[\dX]$
    class_uri: https://concepts.datalad.org/s/things-publications/v1/ISSN
    unique_keys:
      value:
        unique_key_name: value
        unique_key_slots:
        - notation
        description: The ISSN notation is globally unique within the scope of ISSNs
  Publication:
    name: Publication
    description: A resource that is the output of a publishing process.
    notes:
    - There is not slot to indicate authorship, or a publication venue. This is left
      to a PROV attribution.
    from_schema: https://concepts.datalad.org/s/things-publications/v1
    exact_mappings:
    - obo:IAO_0000311
    is_a: Thing
    slots:
    - title
    class_uri: https://concepts.datalad.org/s/things-publications/v1/Publication
  Convention:
    name: Convention
    description: A set of agreed, stipulated, or generally accepted standards, norms,
      social norms, or criteria, often taking the form of a custom.
    from_schema: https://concepts.datalad.org/s/things-resources/v1
    exact_mappings:
    - obo:NCIT_C61300
    - obo:GSSO_010111
    narrow_mappings:
    - obo:MS_1000898
    - obo:T4FS_0000381
    is_a: Thing
    slots:
    - title
    - short_name
    class_uri: https://concepts.datalad.org/s/things-resources/v1/Convention
  Document:
    name: Document
    description: A conceptual entity representing things which a, broadly conceived,
      "documents. This includes non-textual things like images. A conceputal document
      is to be distinguished from its physical, or electronic distributions.
    notes:
    - The key difference between a dataset and a document is the collection-nature
      of the dataset (multiple items of a kind in a collection), whereas a document
      is "one of its kind". A dataset could comprise multiple documents.
    - A document typically has at least one author. However, there are also generated
      documents (e.g., a birth certificate) for which this is irrelevant. And there
      are more roles that could be relevant for a document's provenance. Rather than
      adding them all, none is provided. PROV should be used to express this information.
    from_schema: https://concepts.datalad.org/s/things-resources/v1
    exact_mappings:
    - foaf:Document
    is_a: Thing
    slots:
    - title
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: Document
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-resources/v1/Document
  Grant:
    name: Grant
    description: A grant, typically financial or otherwise quantifiable, resources.
    notes:
    - A grant is not a document. The associated document would be the grant agreement.
    from_schema: https://concepts.datalad.org/s/things-resources/v1
    exact_mappings:
    - obo:NCIT_C16644
    - schema:Grant
    is_a: Thing
    slots:
    - title
    - short_name
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: Grant
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-resources/v1/Grant
  Instrument:
    name: Instrument
    description: A thing that enables an agent to perform an action. This is typically
      a device (e.g., a machine to perform a particular type of measurement), but
      it can also be a questionnaire that is used to perform a particular kind of
      assessment. An instrument is typically not a "reagent".
    notes:
    - It is unclear whether an instrument `name` would provide meaningful and precise
      information (vs a description or an identifier). There is `display_label`, if
      the need for a name is just for display purposes (e.g., to say something generic
      like 'thermometer').
    - Slot `name` is added to avoid `display_label` having to carry unique information.
    from_schema: https://concepts.datalad.org/s/things-resources/v1
    related_mappings:
    - schema:instrument
    narrow_mappings:
    - obo:NCIT_C62103
    is_a: Thing
    slots:
    - name
    class_uri: https://concepts.datalad.org/s/things-resources/v1/Instrument
  ActivityMixin:
    name: ActivityMixin
    description: An activity is something that occurs over a period of time and acts
      upon or with entities; it may include consuming, processing, transforming, modifying,
      relocating, using, or generating entities.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Activity
    mixin: true
    slots:
    - started
    - ended
    - associated_with
    - used
    - informed_by
    - influenced_by
    slot_usage:
      associated_with:
        name: associated_with
        range: Association
        multivalued: true
        inlined: true
        inlined_as_list: true
      ended:
        name: ended
        range: End
        inlined: true
      influenced_by:
        name: influenced_by
        range: Influence
        multivalued: true
        inlined: true
        inlined_as_list: true
      informed_by:
        name: informed_by
        range: Communication
        multivalued: true
        inlined: true
        inlined_as_list: true
      started:
        name: started
        range: Start
        inlined: true
      used:
        name: used
        range: Usage
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: https://concepts.datalad.org/s/things-prov/v1/ActivityMixin
  AgentMixin:
    name: AgentMixin
    description: Something that bears some form of responsibility for an activity
      taking place, for the existence of an entity, or for another agent's activity.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Agent
    mixin: true
    slots:
    - delegated_by
    - influenced_by
    slot_usage:
      delegated_by:
        name: delegated_by
        range: Delegation
        inlined: true
      influenced_by:
        name: influenced_by
        range: Influence
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: https://concepts.datalad.org/s/things-prov/v1/AgentMixin
  EntityMixin:
    name: EntityMixin
    description: A physical, digital, conceptual, or other kind of thing with some
      fixed aspects; entities may be real or imaginary.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Entity
    mixin: true
    slots:
    - attributed_to
    - generated_by
    - derived_from
    - revision_of
    - quoted_from
    - invalidated_by
    - alternate_of
    - specialization_of
    - influenced_by
    slot_usage:
      attributed_to:
        name: attributed_to
        range: Attribution
        multivalued: true
        inlined: true
        inlined_as_list: true
      derived_from:
        name: derived_from
        range: Derivation
        multivalued: true
        inlined: true
        inlined_as_list: true
      generated_by:
        name: generated_by
        range: Generation
        inlined: true
      influenced_by:
        name: influenced_by
        range: Influence
        multivalued: true
        inlined: true
        inlined_as_list: true
      invalidated_by:
        name: invalidated_by
        range: Invalidation
        inlined: true
      quoted_from:
        name: quoted_from
        range: Quotation
        inlined: true
      revision_of:
        name: revision_of
        range: Revision
        inlined: true
    class_uri: https://concepts.datalad.org/s/things-prov/v1/EntityMixin
  InstantaneousEventMixin:
    name: InstantaneousEventMixin
    description: The PROV data model is implicitly based on a notion of instantaneous
      events (or just events), that mark transitions in the world. Events include
      generation, usage, or invalidation of entities, as well as starting or ending
      of activities. This notion of event is not first-class in the data model, but
      it is useful for explaining its other concepts and its semantics
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:InstantaneousEvent
    mixin: true
    slots:
    - at_location
    - at_time
    class_uri: https://concepts.datalad.org/s/things-prov/v1/InstantaneousEventMixin
  Influence:
    name: Influence
    description: Influence is the capacity of an entity, activity, or agent to have
      an effect on the character, development, or behavior of another by means of
      usage, start, end, generation, invalidation, communication, derivation, attribution,
      association, or delegation.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Influence
    mixins:
    - ThingMixin
    slots:
    - object
    - roles
    slot_usage:
      object:
        name: object
        title: Influencer
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Influence
  EntityInfluence:
    name: EntityInfluence
    description: EntityInfluence is the capacity of an entity to have an effect on
      the character, development, or behavior of another by means of usage, start,
      end, derivation, or other.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:EntityInfluence
    is_a: Influence
    slot_usage:
      object:
        name: object
        title: Entity
    class_uri: https://concepts.datalad.org/s/things-prov/v1/EntityInfluence
  Usage:
    name: Usage
    description: Usage is the beginning of utilizing an entity by an activity. Before
      usage, the activity had not begun to utilize this entity and could not have
      been affected by the entity.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Usage
    is_a: EntityInfluence
    mixins:
    - InstantaneousEventMixin
    slot_usage:
      object:
        name: object
        description: Entity that was derived from.
      roles:
        name: roles
        description: Roles the entity had with respect to the derivation.
      at_location:
        name: at_location
        description: Location where the usage took place.
      at_time:
        name: at_time
        description: Timepoint when the usage happened.
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Usage
  Start:
    name: Start
    description: Start is when an activity is deemed to have been started by an entity,
      known as trigger. The activity did not exist before its start. Any usage, generation,
      or invalidation involving an activity follows the activity's start. A start
      may refer to a trigger entity that set off the activity, or to an activity,
      known as starter, that generated the trigger.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Start
    is_a: EntityInfluence
    mixins:
    - InstantaneousEventMixin
    slot_usage:
      object:
        name: object
        title: Trigger
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Start
  End:
    name: End
    description: End is when an activity is deemed to have been ended by an entity,
      known as trigger. The activity no longer exists after its end. Any usage, generation,
      or invalidation involving an activity precedes the activity's end. An end may
      refer to a trigger entity that terminated the activity, or to an activity, known
      as ender that generated the trigger.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:End
    is_a: EntityInfluence
    mixins:
    - InstantaneousEventMixin
    slot_usage:
      object:
        name: object
        title: Trigger
    class_uri: https://concepts.datalad.org/s/things-prov/v1/End
  Derivation:
    name: Derivation
    description: A derivation is a transformation of an entity into another, an update
      of an entity resulting in a new one, or the construction of a new entity based
      on a pre-existing entity.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Derivation
    is_a: EntityInfluence
    slots:
    - generated_by
    - used
    slot_usage:
      object:
        name: object
        description: Entity that was derived from.
      roles:
        name: roles
        description: Roles the entity had with respect to the derivation.
      generated_by:
        name: generated_by
        description: Activity that generated the derived entity.
        range: Generation
        inlined: true
      used:
        name: used
        description: Entities used for the derivation (e.g., instruments).
        range: Usage
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Derivation
  Quotation:
    name: Quotation
    description: A quotation is the repeat of (some or all of) an entity, such as
      text or image, by someone who may or may not be its original author. Quotation
      is a particular case of derivation.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Quotation
    is_a: Derivation
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Quotation
  Revision:
    name: Revision
    description: A revision is a derivation for which the resulting entity is a revised
      version of some original. The implication here is that the resulting entity
      contains substantial content from the original. Revision is a particular case
      of derivation.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Revision
    is_a: Derivation
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Revision
  ActivityInfluence:
    name: ActivityInfluence
    description: ActivitiyInfluence is the capacity of an activity to have an effect
      on the character, development, or behavior of another by means of generation,
      invalidation, communication, or other.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:ActivityInfluence
    is_a: Influence
    slot_usage:
      object:
        name: object
        title: Activity
    class_uri: https://concepts.datalad.org/s/things-prov/v1/ActivityInfluence
  Generation:
    name: Generation
    description: Generation is the completion of production of a new entity by an
      activity. This entity did not exist before generation and becomes available
      for usage after this generation.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Generation
    is_a: ActivityInfluence
    mixins:
    - InstantaneousEventMixin
    slots:
    - used
    slot_usage:
      object:
        name: object
        description: Generating activity.
      roles:
        name: roles
        description: Roles the activity had with respect to the generation.
      at_location:
        name: at_location
        description: Location where the generating activity took place.
      at_time:
        name: at_time
        description: Timepoint when the generating activity happened.
      used:
        name: used
        description: Entities used for the generation (e.g., instruments).
        range: Usage
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Generation
  Communication:
    name: Communication
    description: Communication is the exchange of an entity by two activities, one
      activity using the entity generated by the other.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Communication
    is_a: ActivityInfluence
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Communication
  Invalidation:
    name: Invalidation
    description: Invalidation is the start of the destruction, cessation, or expiry
      of an existing entity by an activity. The entity is no longer available for
      use (or further invalidation) after invalidation. Any generation or usage of
      an entity precedes its invalidation.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Invalidation
    is_a: ActivityInfluence
    mixins:
    - InstantaneousEventMixin
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Invalidation
  AgentInfluence:
    name: AgentInfluence
    description: AgentInfluence is the capacity of an agent to have an effect on the
      character, development, or behavior of another by means of attribution, association,
      delegation, or other.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:AgentInfluence
    is_a: Influence
    slot_usage:
      object:
        name: object
        title: Agent
    class_uri: https://concepts.datalad.org/s/things-prov/v1/AgentInfluence
  Attribution:
    name: Attribution
    description: Attribution is the ascribing of an entity to an agent. When an entity
      e is attributed to agent ag, entity e was generated by some unspecified activity
      that in turn was associated to agent ag. Thus, this relation is useful when
      the activity is not known, or irrelevant.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Attribution
    is_a: AgentInfluence
    slot_usage:
      object:
        name: object
        description: Agent the entity was attributed to.
      roles:
        name: roles
        description: Roles the agent had with respect to the entity.
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Attribution
  Association:
    name: Association
    description: An activity association is an assignment of responsibility to an
      agent for an activity, indicating that the agent had a role in the activity.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Association
    is_a: AgentInfluence
    slots:
    - started
    - ended
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Association
  Delegation:
    name: Delegation
    description: Delegation is the assignment of authority and responsibility to an
      agent (by itself or by another agent) to carry out a specific activity as a
      delegate or representative, while the agent it acts on behalf of retains some
      responsibility for the outcome of the delegated work. For example, a student
      acted on behalf of his supervisor, who acted on behalf of the department chair,
      who acted on behalf of the university; all those agents are responsible in some
      way for the activity that took place but we do not say explicitly who bears
      responsibility and to what degree.
    from_schema: https://concepts.datalad.org/s/things-prov/v1
    exact_mappings:
    - prov:Delegation
    is_a: AgentInfluence
    slots:
    - started
    - ended
    class_uri: https://concepts.datalad.org/s/things-prov/v1/Delegation
  Organization:
    name: Organization
    description: A social or legal institution such as a company, a society, or a
      university.
    from_schema: https://concepts.datalad.org/s/things-social/v1
    exact_mappings:
    - prov:Organization
    is_a: Thing
    slots:
    - name
    - short_name
    - at_location
    - part_of
    slot_usage:
      part_of:
        name: part_of
        description: An organization that the subject is part of.
        range: Organization
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-social/v1/Organization
  Person:
    name: Person
    description: Person agents are people, alive, dead, or fictional.
    from_schema: https://concepts.datalad.org/s/things-social/v1
    exact_mappings:
    - foaf:Person
    - prov:Person
    is_a: Thing
    slots:
    - additional_names
    - family_name
    - given_name
    - honorific_name_prefix
    - honorific_name_suffix
    - formatted_name
    class_uri: https://concepts.datalad.org/s/things-social/v1/Person
  Project:
    name: Project
    description: A collective endeavour of some kind. Typically it is a planned process
      that is undertaken or attempted to meet some requirement, or to achieve a particular
      goal.
    from_schema: https://concepts.datalad.org/s/things-social/v1
    exact_mappings:
    - foaf:Project
    close_mappings:
    - obo:NCIT_C47885
    broad_mappings:
    - obo:BFO_0000015
    is_a: Thing
    slots:
    - short_name
    - title
    - part_of
    slot_usage:
      part_of:
        name: part_of
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-social/v1/Project
  Study:
    name: Study
    description: 'A planned process that consists of parts: planning, study design
      execution, documentation and which produce conclusion(s). An investigational
      endeavour that involves research, enabled by a project. The study relates to
      the scholarly and practical aspects of conducting the research itself, including
      the hypotheses being investigated, the data being gathered and analysed, the
      interpretations being drawn from the data, and the results obtained. In contrast,
      a project that enables it encompasses the administrative aspects of undertaking
      the endeavour, including the funding obtained, the people involved, and the
      management of the project in terms of deadlines and deliverables.'
    from_schema: https://concepts.datalad.org/s/things-study/v1
    exact_mappings:
    - obo:OBI_0000066
    - sio:SIO_001066
    - FRAPO:Investigation
    narrow_mappings:
    - sio:SIO_000994
    - obo:NCIT_C15206
    broad_mappings:
    - prov:Activity
    - obo:BFO_0000015
    is_a: Thing
    slots:
    - dimensions
    - factors
    - title
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: Study
        multivalued: true
    class_uri: https://concepts.datalad.org/s/things-study/v1/Study
  Subject:
    name: Subject
    description: A subject is an entity being investigated in a study. This is a contextual
      entity. One and the same entity can be different subjects in two different studies.
    comments:
    - Rather than adding a `name` slot to assign a subject identifier, the `identifiers`
      slot should be used for that -- possible also identifying the issuing entity
      of that identifier via `creator`.
    from_schema: https://concepts.datalad.org/s/things-study/v1
    is_a: Thing
    slots:
    - study
    slot_usage:
      study:
        name: study
        range: Study
      kind:
        name: kind
        description: A classifier that identifies the nature/type of a subject. For
          specimen (a subject derived/taken from another subject), this classifier
          should be more precise than the classifier of the source subject.
        title: Type
    class_uri: https://concepts.datalad.org/s/things-study/v1/Subject
  ThingMixin:
    name: ThingMixin
    description: Mix-in with the common interface of `Thing` and `AttributeSpecification`.
      This interface enables type specifications (`rdf:type`) for things and attributes
      via a `type` designator slot to indicate specialized schema classes for validation
      where a slot's `range` is too generic. A thing or attribute can be further describe
      with statements on qualified relations to other things (`characterized_by`),
      or inline attributes (`attributes`). A set of `mappings` slots enables the alignment
      for arbitrary external schemas and terminologies.
    from_schema: https://concepts.datalad.org/s/things/v2
    mixin: true
    slots:
    - about
    - annotations
    - broad_mappings
    - close_mappings
    - description
    - display_label
    - display_note
    - editorial_notes
    - exact_mappings
    - identifiers
    - kind
    - attributes
    - characterized_by
    - narrow_mappings
    - related_mappings
    - schema_type
    class_uri: dlthings:ThingMixin
  ValueSpecificationMixin:
    name: ValueSpecificationMixin
    description: Mix-in for a (structured) value specification. Two slots are provided
      to define a (literal) value (`value`) and its type (`range`).
    comments:
    - This mixin enables the expression of quantitative and qualitative assessments/measurements/values.
      For a quantitative value, the numerical value, and a possible unit is given.
      For a qualitative value, `defined_by` is used to identify the quality of the
      assessment from a controlled vocabulary or standard term.
    from_schema: https://concepts.datalad.org/s/things/v2
    mixin: true
    slots:
    - defined_by
    - range
    - unit
    - value
    class_uri: dlthings:ValueSpecificationMixin
  AttributeSpecification:
    name: AttributeSpecification
    description: An attribute is conceptually a thing, but it requires no dedicated
      identifier (`pid`). Instead, it is linked to a `Thing` via its `attributes`
      slot and declares a `predicate` on the nature of the relationship.
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - sio:SIO_000614
    close_mappings:
    - dlthings:Thing
    mixins:
    - ThingMixin
    - ValueSpecificationMixin
    slots:
    - predicate
    slot_usage:
      about:
        name: about
        multivalued: true
      predicate:
        name: predicate
        range: Property
        required: true
    class_uri: dlthings:AttributeSpecification
  Identifier:
    name: Identifier
    description: An identifier is a label that uniquely identifies an item in a particular
      context. Some identifiers are globally unique. All identifiers are unique within
      their individual scope.
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - obo:IAO_0020000
    mixins:
    - ThingMixin
    slots:
    - creator
    - notation
    slot_usage:
      notation:
        name: notation
        required: true
    class_uri: dlthings:Identifier
  Property:
    name: Property
    description: An RDF property, a `Thing` used to define a `predicate`, for example
      in a `Statement`.
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - rdf:Property
    is_a: Thing
    class_uri: dlthings:Property
  Statement:
    name: Statement
    description: An RDF statement that links a `predicate` (a `Property`) with an
      `object` (a `Thing`) to the subject to form a triple. A `Statement` is used
      to qualify a relation to a `Thing` referenced by its identifier. For specifying
      a qualified relation to an attribute that has no dedicated identifier, use an
      `AttributeSpecification`.
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - rdf:Statement
    slots:
    - object
    - predicate
    - annotations
    - characterized_by
    - editorial_notes
    slot_usage:
      object:
        name: object
        range: Thing
        required: true
      predicate:
        name: predicate
        range: Property
        required: true
      characterized_by:
        name: characterized_by
        description: Make statements about statement, also known as reification.
        see_also:
        - https://patterns.dataincubator.org/book/reified-statement.html
    class_uri: dlthings:Statement
  Thing:
    name: Thing
    description: The most basic, identifiable item. In addition to the slots that
      are common between a `Thing` and an `AttributeSpecification` (see `ThingMixin`),
      two additional slots are provided. The `pid` slot takes the required identifier
      for a `Thing`. The `relation` slot allows for the inline specification of other
      `Thing` instances. Such a relation is unqualified (and symmetric), and should
      be further characterized via a `Statement` (see `characterized_by`). From a
      schema perspective, the `relation` slots allows for building self-contained,
      structured documents (e.g., a JSON object) with arbitrarily complex information
      on a `Thing`.
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - schema:Thing
    mixins:
    - ThingMixin
    slots:
    - pid
    - relations
    slot_usage:
      about:
        name: about
        multivalued: true
      relations:
        name: relations
        inlined: true
        inlined_as_list: false
    class_uri: dlthings:Thing
  ValueSpecification:
    name: ValueSpecification
    description: A `Thing` that is a value of some kind. This class can be used to
      describe an outcome of a measurement, a factual value or constant, or other
      qualitative or quantitative information with an associated identifier. If no
      identifier is available, an `AttributeSpecification` can be used within the
      context of an associated `Thing` (`attributes`).
    from_schema: https://concepts.datalad.org/s/things/v2
    exact_mappings:
    - obo:OBI_0001933
    is_a: Thing
    mixins:
    - ValueSpecificationMixin
    slot_usage:
      value:
        name: value
        notes:
        - It is required, because when it is not needed, `Thing` should be used as
          a type. Its absence is therefore likely a sign of an error.
        required: true
    class_uri: dlthings:ValueSpecification
  Annotation:
    name: Annotation
    description: A tag/value pair with the semantics of OWL Annotation.
    from_schema: https://concepts.datalad.org/s/things/v2
    slots:
    - annotation_tag
    - annotation_value
    slot_usage:
      annotation_tag:
        name: annotation_tag
        key: true
        range: AnnotationTag
    class_uri: dlthings:Annotation
  AnnotationTag:
    name: AnnotationTag
    description: A tag identifying an annotation.
    title: Annotation tag
    from_schema: https://concepts.datalad.org/s/things/v2
    is_a: Thing
    class_uri: dlthings:AnnotationTag
  Rule:
    name: Rule
    description: Permissions, prohibitions, obligations or other rights/policies.
      This can be a standard license, a custom usage agreement, or a codified policy.
    from_schema: https://concepts.datalad.org/s/things-rules/v1
    is_a: Thing
    slots:
    - title
    - short_name
    class_uri: https://concepts.datalad.org/s/things-rules/v1/Rule
