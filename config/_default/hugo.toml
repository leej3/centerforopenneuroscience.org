baseURL = "http://127.0.0.1:1313/"
theme = "congo"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 30
disableKinds = ["RSS"]
ignoreFiles = ["^CNAME$", "^pages/"]

[pagination]
  pagerSize = 15

[outputs]
  home = ["HTML"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
