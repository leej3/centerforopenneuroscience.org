---
name: Validate Orinoco Lite preview

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate and Congo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.19"
          python-version: "3.12"
          enable-cache: true

      - name: Run the milestone publication contract
        env:
          BASE_URL: https://example.invalid/orinoco-lite-preview/
        run: scripts/test-milestone.sh
