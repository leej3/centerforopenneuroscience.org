---
name: Publish Orinoco Lite preview

on:
  push:
    branches: [orinoco-lite]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'leej3/centerforopenneuroscience.org'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate and Congo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install the locked build environment
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.73.0
          cache: true
          locked: true

      - name: Retrieve the required legacy annex content
        run: |
          pixi run --locked git annex init github-actions
          git remote add datasets.datalad.org https://datasets.datalad.org/centerforopenneuroscience/con.org/.git/
          git fetch datasets.datalad.org git-annex:refs/remotes/datasets.datalad.org/git-annex
          pixi run --locked git annex enableremote datasets.datalad.org
          pixi run --locked git annex get --from datasets.datalad.org assets/img/yaroslav-halchenko.jpg
          pixi run --locked git annex fsck --fast assets/img/yaroslav-halchenko.jpg

      - name: Read the fork Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with the Pages-provided base URL
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
          BUILD_DIR: build-pages
        run: pixi run --locked build

      - name: Upload the static preview
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build-pages/site

  deploy:
    if: github.repository == 'leej3/centerforopenneuroscience.org'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the fork preview
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
