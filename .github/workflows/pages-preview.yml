---
name: Publish Orinoco Lite preview

on:
  push:
    branches: [orinoco-lite]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'leej3/centerforopenneuroscience.org'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate and Congo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.19"
          python-version: "3.12"
          enable-cache: true

      - name: Read the fork Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Run the milestone publication contract
        env:
          BASE_URL: https://example.invalid/orinoco-lite-preview/
        run: scripts/test-milestone.sh

      - name: Build with the Pages-provided base URL
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
          BUILD_DIR: build-pages
        run: scripts/build.sh

      - name: Upload the static preview
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build-pages/site

  deploy:
    if: github.repository == 'leej3/centerforopenneuroscience.org'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the fork preview
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
